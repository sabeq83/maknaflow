[data-theme='light'] {
  color-scheme: light;
  --canvas: #f2f5f8;
  --sidebar: #ffffff;
  --surface: #ffffff;
  --surface-raised: #f7f9fc;
  --surface-interactive: #edf2f7;
  --surface-hover: #e6edf5;
  --input-bg: #ffffff;
  --overlay-subtle: rgba(30, 41, 59, 0.08);
  --overlay-backdrop: rgba(15, 23, 42, 0.54);
  --text-primary: #152033;
  --text-secondary: #40506a;
  --text-muted: #66758a;
  --text-disabled: #8794a6;
  --border-subtle: #d8e0ea;
  --border-strong: #aebccd;
  --action-primary: #087f73;
  --action-primary-hover: #06665d;
  --on-action-primary: #ffffff;
  --link: #075ea8;
  --link-hover: #064b86;
  --status-info: #1d63b7;
  --status-info-soft: #e8f1fc;
  --status-success: #177a43;
  --status-success-soft: #e6f5ec;
  --status-warning: #925c08;
  --status-warning-soft: #fff3d7;
  --status-danger: #b4233d;
  --status-danger-soft: #fdebef;
  --status-neutral: #6548bd;
  --status-neutral-soft: #f0ecfb;
  --focus-ring: #6d4ed6;
  --shadow-card: 0 12px 34px rgba(31, 45, 61, 0.09);
  --shadow-modal: 0 26px 80px rgba(31, 45, 61, 0.22);
  --platform-google: #185abc;
  --platform-facebook: #1769c2;
  --platform-youtube: #c81e1e;
  --accent-glow: rgba(8, 127, 115, 0.14);
  --accent-dark: #06665d;
  --accent-rgb: 8, 127, 115;
}

html,
body { background: var(--canvas); color: var(--text-primary); }

body,
button,
input,
textarea,
select { color: var(--text-primary); }

a { color: var(--link); }
a:hover { color: var(--link-hover); }

:focus-visible {
  outline: 3px solid color-mix(in srgb, var(--focus-ring) 72%, transparent);
  outline-offset: 2px;
}

.sidebar { background: var(--sidebar); border-color: var(--border-subtle); }
.card,
.modal,
.modal-content,
[role='dialog'] { background-color: var(--surface); border-color: var(--border-subtle); color: var(--text-primary); }

.modal-overlay,
.dialog-overlay,
[data-modal-overlay='true'] { background: var(--overlay-backdrop); }

.modal-header,
.modal-footer { border-color: var(--border-subtle); }

.form-input,
.form-select,
input:not([type='checkbox']):not([type='radio']):not([type='file']),
textarea,
select {
  background-color: var(--input-bg);
  color: var(--text-primary);
  border-color: var(--border-subtle);
}

input::placeholder,
textarea::placeholder { color: var(--text-muted); opacity: 1; }

.btn-primary {
  background: var(--action-primary);
  border-color: var(--action-primary);
  color: var(--on-action-primary);
}
.btn-primary:hover { background: var(--action-primary-hover); border-color: var(--action-primary-hover); }
.btn-secondary { background: var(--surface-interactive); border-color: var(--border-subtle); color: var(--text-primary); }
.btn-danger { background: var(--status-danger-soft); border-color: var(--status-danger); color: var(--status-danger); }
.btn-success { background: var(--status-success-soft); border-color: var(--status-success); color: var(--status-success); }

/* Harmonized actions used by ContentFlow cards and dialogs. */
.content-action {
  border: 1px solid var(--border-subtle);
  border-radius: 10px;
  color: var(--text-primary);
  cursor: pointer;
  font-weight: 700;

.content-action:hover:not(:disabled) { transform: translateY(-1px); }

.contentflow-view-tab-active { background: var(--status-info-soft); border-color: var(--status-info); color: var(--status-info); }

.contentflow-brand-tab { background: var(--surface-interactive); border: 1px solid var(--border-strong); color: var(--text-secondary); }
.contentflow-brand-tab:hover { background: var(--surface-hover); border-color: var(--status-info); color: var(--text-primary); }
.contentflow-brand-tab-active { background: var(--status-success-soft); border: 1px solid var(--status-success); color: var(--status-success); box-shadow: 0 0 0 1px color-mix(in srgb, var(--status-success) 18%, transparent); }
.contentflow-brand-tab-active:hover { background: var(--status-success-soft); border-color: var(--status-success); color: var(--status-success); }
.contentflow-release-date { width: 168px; max-width: 100%; box-sizing: border-box; color-scheme: inherit; }

.sidebar-brand-subtab-active { background: var(--status-success-soft); border-left-color: var(--status-success); color: var(--status-success); box-shadow: 0 0 0 1px color-mix(in srgb, var(--status-success) 14%, transparent); }

[data-theme='light'] a.sidebar-brand-subtab-active:hover { background: #dff3e7; border-left-color: #177a43; color: #0b5d38; }

/* User Management table surfaces remain legible in both themes. */
.user-table-shell { background: var(--surface); border: 1px solid var(--border-subtle); box-shadow: var(--shadow-card); }
.user-table-head { background: var(--surface-raised); color: var(--text-secondary); }
.user-table-row { background: var(--surface); border-bottom: 1px solid var(--border-subtle); transition: background-color .15s ease; }
.user-table-row:hover { background: var(--surface-hover); }
.user-role-admin { background: var(--status-info-soft); border: 1px solid var(--status-info); color: var(--status-info); }
.user-role-user { background: var(--surface-interactive); border: 1px solid var(--border-strong); color: var(--text-secondary); }
.user-brand-badge { background: var(--status-neutral-soft); border: 1px solid color-mix(in srgb, var(--status-neutral) 45%, transparent); color: var(--status-neutral); }

.text-danger { color: var(--status-danger); }
.status-pending,
.status-warning { color: var(--status-warning); background: var(--status-warning-soft); }
.status-success,
.status-completed { color: var(--status-success); background: var(--status-success-soft); }

.status-info,

option { background: var(--surface); color: var(--text-primary); }

/* Reusable theme control. */
.theme-toggle {
  width: 100%;
  min-height: 38px;
  padding: 8px 12px;
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm, 8px);

  display: flex;
  align-items: center;

  gap: 8px;
  font-size: .85rem;
  font-weight: 650;

.theme-toggle:hover { background: var(--surface-hover); border-color: var(--border-strong); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
}

let intro='',after='';if(k==='planner'){intro=`<div class="callout">Planner ini hanya digunakan untuk batch Pillar yang sedang dibuat. Setelah dipakai menjadi campaign, Planner ditandai consumed dan tidak dapat dipakai lagi.</div><div class="fields">${MODEFIELDS.planner.map((f,i)=>visible(f,k)?control(f,k,'mode'+i):'').join('')}</div><div class="divider"></div>`;if(s.inputMode==='existing'||s.plannerFocus==='recipe_campaign')intro+=library(k,'recipeProductIds','Pilih Produk dari Database',s.plannerFocus==='recipe_campaign');after+=`<div class="divider"></div><div class="fields">${control(s.plannerFocus==='recipe_campaign'?field('recipeCount','Jumlah Resep (1–30)','number',[],3):s.plannerFocus==='brand_editorial'?field('editorialRowsPerPillar','Jumlah Baris Planner (kelipatan pilar)','select',Array.from({length:Math.floor(30/Math.max(1,(s.pillars||[]).length))},(_,i)=>[i+1,((s.pillars||[]).length*(i+1))+' Baris — '+(i+1)+' ide per pilar']),2):field('productPlannerCount','Jumlah Baris Planner','select',[6,12,18,24,30],6),k,'count')}</div>`;}
if(k==='re'&&step.group==='Sumber & Mode Eksekusi')intro=`<div class="fields">${MODEFIELDS.re.map((f,i)=>control(f,k,'mode'+i)).join('')}</div><div class="callout" style="margin-top:20px">${s.executionMode==='manual_review'?'Discovery berhenti untuk review storyboard & naskah sebelum produksi.':'Full Auto Pilot menjalankan naskah → TTS → G-Labs → FFmpeg. Visual mode mengikuti Pure Text-to-Video.'} Approval tayang Studio tetap dilakukan terpisah.</div>`;

if(k==='recipeStatic'&&step.group==='Layout & Komposisi'){intro=`<div class="fields">${control(field('imagesPerRecipe','Jumlah Gambar T2I per Resep','select',[3,4,5,6],4),k,'images')}</div><div class="divider"></div>`;after+=`<div class="collage" style="--demo-gap:${Number(s.gridGapSize)||12}px;--demo-padding:${Number(s.gridOuterPadding)||16}px;--demo-radius:${Number(s.gridBorderRadius)||16}px">${(COORDINATES[Number(s.imagesPerRecipe)||4]?.[s.selectedLayoutId]||[]).map((slot,i)=>`<span style="grid-column:${slot.x+1}/span ${slot.w};grid-row:${slot.y+1}/span ${slot.h}">${['Bahan Mentah','Persiapan & Bumbu','Proses Memasak','Sajian Akhir','Detail Garnish','Plating Piring'][i]}</span>`).join('')}</div><p class="hint">Preview memakai koordinat layout dari Recipe Labs; foto masih berupa blok contoh.</p>`;}

function special(step){if(step.special==='recipeMode')return `<div class="grid" style="grid-template-columns:1fr 1fr">${[['static','Static Post Campaign','Konfigurasi kategori, fotografi AI, jumlah gambar, preset layout dan komposisi kolase.'],['video','Reels Video Storyboard (Naskah & DNA)','Naskah & Video DNA, hook, visual, bridging, identitas dan workflow sesuai Recipe Labs. Tidak menjamin video final tersedia.']].map(([v,t,desc])=>`<button class="choice" style="border-color:var(${recipeMode===v?'--action-primary':'--border-subtle'})" onclick="recipeMode='${v}';render()"><strong>${t}</strong><small>${desc}</small><span class="accent">${recipeMode===v?'✓ Dipilih':'Pilih mode'}</span></button>`).join('')}</div><div class="callout" style="margin-top:20px">Recipe Labs dan Recipe Planner adalah jalur yang berbeda. Recipe Planner tetap berada pada cabang Pillar. Penamaan dan kemampuan hasil mengikuti engine masing-masing.</div>`;
if(step.special==='plannerReview')return `<div class="callout">Review hasil Planner sebelum dipakai menjadi Pillar Campaign. Menghasilkan Planner belum berarti mengirim batch untuk produksi.</div><button class="primary" ${consumed?'disabled':''} onclick="plannerReady=true;toast('Hasil Planner contoh tersedia. Tidak ada panggilan AI.');render()">${plannerReady?'↻ Simulasikan Generate Ulang Planner':'✦ Simulasikan Generate Planner'}</button>${plannerReady?`<table class="table" style="margin-top:20px"><thead><tr><th>No</th><th>Topik contoh</th><th>Status</th></tr></thead><tbody>${[1,2,3].map(n=>`<tr><td>${n}</td><td>Rencana konten ${n} · ${esc(state('planner').plannerFocus)}</td><td><span class="badge">Siap untuk batch ini</span></td></tr>`).join('')}</tbody></table><p class="hint" style="margin-top:15px">Saat batch disimpan, Planner ini dipakai sekali untuk campaign tersebut. Tidak tersedia untuk batch lainnya.</p>`:''}`;
if(step.special==='schedule')return `<div class="callout">Waktu mulai produksi terpisah dari waktu tayang. Konten hanya diteruskan ke Repliz sesudah review dan approval.</div><div class="fields">${control(field('batchName','Nama Batch','text',[],'Batch '+names[engine]),'schedule','name')}${control(field('generationAt','Mulai Generate Konten','datetime-local',[],'2026-10-23T08:00'),'schedule','generate')}${control(field('publishAt','Target Waktu Tayang','datetime-local',[],'2026-10-24T19:00'),'schedule','publish')}${control(field('account','Akun Publikasi (Repliz)','select',[['demo-account','Akun Demo · data contoh']]),'schedule','account')}${control(field('cadence','Jeda antar hasil (menit)','number',[],60),'schedule','cadence')}</div><div class="callout" style="margin-top:24px">Hasil banyak akan memiliki slot masing-masing. Target tayang dapat disesuaikan lagi per konten sebelum approval.</div>`;

function render(){const app=$('#app');if(view==='choose'){app.innerHTML=choose();return;}if(view==='calendar'){app.innerHTML=calendar();return;}let list=steps();idx=Math.min(idx,list.length-1);let step=list[idx];app.innerHTML=`<div class="row between" style="margin-bottom:22px"><div><div class="section-kicker">Batch baru / ${names[engine]}</div><h1>Konfigurasi campaign</h1><p style="margin:0">${engine==='pillar'?'Planner → Konfigurasi Pillar → Jadwal → Review':'Konfigurasi menu asal → Jadwal → Review'}</p></div><button onclick="view='choose';render()">Ganti Jenis Campaign</button></div><div class="layout"><aside class="card steps" aria-label="Langkah wizard">${list.map((s,i)=>`<button class="${i===idx?'active':''}" onclick="idx=${i};error='';render()" ${i===idx?'aria-current="step"':''}><span class="num">${i+1}</span><span>${esc(s.title)}</span></button>`).join('')}</aside><section class="card" style="padding:0;overflow:hidden"><div class="formbody"><div class="row between"><small>LANGKAH ${idx+1} DARI ${list.length}</small><span class="tag">${names[engine]}</span></div><div class="progress"><div style="width:${(idx+1)/list.length*100}%"></div></div><h2>${esc(step.title)}</h2><p>${step.special?'Lengkapi langkah ini untuk melanjutkan batch.':'Pengaturan dari '+(step.kind==='planner'?'Generator Content Planner':names[engine])+' disajikan per bagian.'}</p>${error?`<div class="error" role="alert">${esc(error)}</div>`:''}<form id="stepForm" onsubmit="event.preventDefault();next()">${step.special?special(step):renderFields(step)}</form></div><div class="footer"><button ${idx===0?'disabled':''} onclick="idx--;error='';render()">← Kembali</button><span class="muted mobilehide" style="font-size:11px">Nilai tetap tersimpan saat berpindah langkah</span><button class="primary" onclick="next()">${idx===list.length-1?'Simpan Batch Simulasi':'Lanjut →'}</button></div></section></div>`;document.querySelectorAll('input[type=text]').forEach(el=>{if(el.id.includes('generationAt')||el.id.includes('publishAt'))el.type='datetime-local'});}
