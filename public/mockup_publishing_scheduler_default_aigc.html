<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mockup — Publishing Scheduler: Default AIGC Checked & Live Tanpa Approval</title>
  <link rel="stylesheet" href="/app/theme.css">
  <style>
    :root {
      --surface: #0f172a;
      --surface-raised: #1e293b;
      --surface-interactive: #334155;
      --surface-subtle: #1e293b80;
      --border-subtle: #334155;
      --border-strong: #475569;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --action-primary: #3b82f6;
      --action-primary-hover: #2563eb;
      --status-info: #38bdf8;
      --status-info-soft: rgba(56, 189, 248, 0.15);
      --status-success: #4ade80;
      --status-success-soft: rgba(74, 222, 128, 0.15);
      --status-warning: #fbbf24;
      --status-warning-soft: rgba(251, 191, 36, 0.15);
    }
    body {
      margin: 0;
      padding: 24px;
      background-color: var(--surface);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .modal-box {
      max-width: 600px;
      margin: 20px auto;
      background: var(--surface-raised);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 12px;
    }
    .modal-header h3 {
      margin: 0;
      font-size: 16px;
      color: var(--text-primary);
    }
    .provider-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .provider-tab {
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid var(--border-subtle);
      background: var(--surface);
      color: var(--text-secondary);
      cursor: pointer;
    }
    .provider-tab.active {
      background: var(--action-primary);
      color: #ffffff;
      border-color: var(--action-primary);
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 6px;
    }
    .badge-mode {
      font-size: 10px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--status-success-soft);
      color: var(--status-success);
      border: 1px solid var(--status-success);
    }
    .select-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      padding: 9px 12px;
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 600;
    }
    .autopilot-notice {
      margin-top: 6px;
      font-size: 11px;
      color: var(--status-success);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .aigc-box {
      margin-bottom: 16px;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--status-info);
      border-radius: 8px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .aigc-checkbox {
      margin-top: 3px;
      width: 16px;
      height: 16px;
      accent-color: var(--action-primary);
      cursor: pointer;
    }
    .aigc-label {
      font-size: 12px;
      color: var(--text-primary);
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }
    .aigc-title {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge-default {
      font-size: 9px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--status-info-soft);
      color: var(--status-info);
      border: 1px solid var(--status-info);
    }
    .aigc-desc {
      font-size: 11px;
      color: var(--text-secondary);
      font-weight: 400;
      margin-top: 4px;
      line-height: 1.4;
    }
    .btn-submit {
      width: 100%;
      padding: 11px;
      border-radius: 8px;
      background: var(--action-primary);
      color: #ffffff;
      font-weight: 700;
      font-size: 13px;
      border: none;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div class="modal-box">
    <div class="modal-header">
      <h3>🚀 Jadwalkan Publikasi Konten (Simulasi Modal)</h3>
      <span style="font-size: 12px; color: var(--text-muted); cursor: pointer;">✕</span>
    </div>

    <div class="provider-tabs">
      <div class="provider-tab active">🌐 Repliz Cloud (Multi-Platform)</div>
      <div class="provider-tab">Facebook Direct</div>
    </div>

    <!-- 1. Mode Publikasi Baru: Live Tanpa Approval -->
    <div class="form-group">
      <div class="form-label">
        <span>Mode Publikasi</span>
        <span class="badge-mode">🟢 LIVE (AUTOPILOT)</span>
      </div>
      <select class="select-input" id="publish_mode_select">
        <option value="live" selected>🟢 Live (Langsung publish otomatis sesuai jadwal — Tanpa Approval)</option>
        <option value="draft">📝 Draft (Tersimpan sebagai draft di platform tujuan)</option>
      </select>
      <div class="autopilot-notice">
        <span>⚡</span> <span>Postingan akan otomatis dikirim ke Repliz tepat pada waktu yang dijadwalkan tanpa perlu konfirmasi ulang.</span>
      </div>
    </div>

    <!-- 2. Opsi AIGC Default Checked -->
    <div class="aigc-box">
      <input type="checkbox" id="aigc_default_check" class="aigc-checkbox" checked>
      <label for="aigc_default_check" class="aigc-label">
        <span class="aigc-title">
          <span>Label AI-Generated Content (AIGC)</span>
          <span class="badge-default">DEFAULT AKTIF</span>
        </span>
        <span class="aigc-desc">
          Otomatis tercentang saat modal dibuka untuk memenuhi standar kepatuhan AI Disclosure platform (TikTok AIGC, Meta AI Label, YouTube Synthetic Media). Pengguna tetap dapat mencentang ulang secara manual jika diperlukan.
        </span>
      </label>
    </div>

    <div style="margin-top: 20px;">
      <button class="btn-submit">
        <span>🚀</span> <span>Jadwalkan Publikasi Autopilot</span>
      </button>
    </div>
  </div>
</body>
</html>
