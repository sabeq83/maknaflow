<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="gridGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <radialGradient id="glowM" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="64" height="64" rx="14" fill="#0B1120"/>
  
  <!-- Subtle Background Grid Dots -->
  <g opacity="0.18" fill="#00F2FE">
    <circle cx="14" cy="14" r="1"/><circle cx="23" cy="14" r="1"/><circle cx="32" cy="14" r="1"/><circle cx="41" cy="14" r="1"/><circle cx="50" cy="14" r="1"/>
    <circle cx="14" cy="23" r="1"/><circle cx="23" cy="23" r="1"/><circle cx="32" cy="23" r="1"/><circle cx="41" cy="23" r="1"/><circle cx="50" cy="23" r="1"/>
    <circle cx="14" cy="32" r="1"/><circle cx="23" cy="32" r="1"/><circle cx="32" cy="32" r="1"/><circle cx="41" cy="32" r="1"/><circle cx="50" cy="32" r="1"/>
    <circle cx="14" cy="41" r="1"/><circle cx="23" cy="41" r="1"/><circle cx="32" cy="41" r="1"/><circle cx="41" cy="41" r="1"/><circle cx="50" cy="41" r="1"/>
    <circle cx="14" cy="50" r="1"/><circle cx="23" cy="50" r="1"/><circle cx="32" cy="50" r="1"/><circle cx="41" cy="50" r="1"/><circle cx="50" cy="50" r="1"/>
  </g>

  <!-- Glow effect -->
  <circle cx="32" cy="32" r="22" fill="url(#glowM)"/>

  <!-- Neural Monogram 'M' Lines -->
  <path d="M16 48 L16 16 L32 34 L48 16 L48 48" stroke="url(#gridGradM)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>
  
  <!-- Internal grid lattice connectors -->
  <path d="M16 28 L24 28 L32 37 L40 28 L48 28" stroke="#00F2FE" stroke-width="1.5" opacity="0.6" stroke-dasharray="2 2"/>
  <path d="M16 38 L48 38" stroke="#10B981" stroke-width="1.5" opacity="0.5" stroke-dasharray="2 2"/>
  <path d="M24 16 L24 48 M40 16 L40 48" stroke="#3B82F6" stroke-width="1.5" opacity="0.4" stroke-dasharray="2 2"/>

  <!-- Glowing Nodes at Vertices -->
  <g fill="#00F2FE">
    <circle cx="16" cy="16" r="3"/>
    <circle cx="48" cy="16" r="3"/>
    <circle cx="32" cy="34" r="3.5" fill="#10B981"/>
    <circle cx="16" cy="48" r="3"/>
    <circle cx="48" cy="48" r="3"/>
    <circle cx="24" cy="25" r="1.8" fill="#3B82F6"/>
    <circle cx="40" cy="25" r="1.8" fill="#3B82F6"/>
  </g>
</svg>
