<svg width="64" height="64" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cf_fav_outer" x1="15%" y1="90%" x2="85%" y2="10%">
      <stop offset="0%" stopColor="#00D2FF" />
      <stop offset="35%" stopColor="#2563EB" />
      <stop offset="70%" stopColor="#7C3AED" />
      <stop offset="100%" stopColor="#A855F7" />
    </linearGradient>
    <linearGradient id="cf_fav_play" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#2563EB" />
      <stop offset="100%" stopColor="#7C3AED" />
    </linearGradient>
    <linearGradient id="cf_fav_stream" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stopColor="#38BDF8" stopOpacity="0.8" />
      <stop offset="100%" stopColor="#818CF8" stopOpacity="0.9" />
    </linearGradient>
    <linearGradient id="cf_fav_box1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#8B5CF6" />
      <stop offset="100%" stopColor="#6366F1" />
    </linearGradient>
    <linearGradient id="cf_fav_box2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#00D2FF" />
      <stop offset="100%" stopColor="#3B82F6" />
    </linearGradient>
    <linearGradient id="cf_fav_box3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#A855F7" />
      <stop offset="100%" stopColor="#7C3AED" />
    </linearGradient>
  </defs>

  <!-- Background Glow Circle for crisp contrast in both dark & light tab bars -->
  <circle cx="60" cy="60" r="56" fill="#0A0F1D" />

  <!-- Stylized Outer 'C' Curve -->
  <path
    d="M62 25 C40 25 24 39 24 60 C24 81 40 95 62 95 C74 95 84 89 90 80 C87 77 82 75 76 77 C71 82 64 85 57 85 C42 85 34 74 34 60 C34 46 42 35 57 35 C64 35 70 38 74 43 C79 45 85 43 89 39 C83 30 73 25 62 25 Z"
    fill="url(#cf_fav_outer)"
  />

  <!-- Sparkle Star on top right -->
  <path
    d="M86 16 C86 21 89 24 94 24 C89 24 86 27 86 32 C86 27 83 24 78 24 C83 24 86 21 86 16 Z"
    fill="#818CF8"
  />

  <!-- Central Play Button Triangle -->
  <path
    d="M48 45 L68 59 L48 73 Z"
    fill="url(#cf_fav_play)"
    stroke="#FFFFFF"
    strokeWidth="1.5"
    strokeLinejoin="round"
  />

  <!-- 3 Flow Motion Trails -->
  <path d="M68 53 Q80 50 90 38" stroke="url(#cf_fav_stream)" strokeWidth="3" strokeLinecap="round" fill="none" />
  <path d="M72 59 Q83 59 96 59" stroke="url(#cf_fav_stream)" strokeWidth="3.5" strokeLinecap="round" fill="none" />
  <path d="M68 65 Q80 68 90 80" stroke="url(#cf_fav_stream)" strokeWidth="3" strokeLinecap="round" fill="none" />

  <!-- 3 Floating Rounded Particle Squares -->
  <rect x="91" y="30" width="14" height="14" rx="3.5" fill="url(#cf_fav_box1)" />
  <rect x="97" y="52" width="14" height="14" rx="3.5" fill="url(#cf_fav_box2)" />
  <rect x="91" y="74" width="14" height="14" rx="3.5" fill="url(#cf_fav_box3)" />
</svg>
