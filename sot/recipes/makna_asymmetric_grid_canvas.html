        // === INLINE SVG ICONS REPLACEMENT ===
        const Icons = {

            Download: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>,

            Settings: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>,
            Type: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" x2="15" y1="20" y2="20"/><line x1="12" x2="12" y1="4" y2="20"/></svg>,

            Trash2: () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>,
            Layers: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polygon points="2 17 12 22 22 17"/><polygon points="2 12 12 17 22 12"/></svg>,
            Sliders: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="4" x2="4" y1="21" y2="14"/><line x1="4" x2="4" y1="10" y2="3"/><line x1="12" x2="12" y1="21" y2="12"/><line x1="12" x2="12" y1="8" y2="3"/><line x1="20" x2="20" y1="21" y2="16"/><line x1="20" x2="20" y1="12" y2="3"/><line x1="2" x2="6" y1="14" y2="14"/><line x1="10" x2="14" y1="8" y2="8"/><line x1="18" x2="22" y1="16" y2="16"/></svg>,
            FileImage: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>,
            Check: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
            Loader2: () => <svg class="animate-spin" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>,
            ImageIcon: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
        };

        function App() {
            const [slotCount, setSlotCount] = useState(4); 
            const [selectedLayout, setSelectedLayout] = useState(LAYOUT_MATRIX[4][0]);
            const [images, setImages] = useState({
                1: MOCK_IMAGES[1],
                2: MOCK_IMAGES[2],
                3: MOCK_IMAGES[3],
                4: MOCK_IMAGES[4],
                5: MOCK_IMAGES[5],
                6: MOCK_IMAGES[6]
            });
            
            const [gapSize, setGapSize] = useState(12); 
            const [borderRadius, setBorderRadius] = useState(16); 
            const [bgColor, setBgColor] = useState('#0d0d12'); 
            const [borderColor, setBorderColor] = useState('#27272a');
            const [borderWidth, setBorderWidth] = useState(0); 
            const [outerPadding, setOuterPadding] = useState(16); 
            
            const [titleText, setTitleText] = useState('RESEP SIASAT SEHAT');
            const [subtitleText, setSubtitleText] = useState('Enak, Menggugah Selera, & Rendah Kalori');
            const [showText, setShowText] = useState(true);
            const [fontFamily, setFontFamily] = useState('serif'); 
            const [textPosition, setTextPosition] = useState('bottom'); 
            const [textColor, setTextColor] = useState('#ffffff');
            const [textBgOpacity, setTextBgOpacity] = useState(85); 
            
            const [exporting, setExporting] = useState(false);
            const [exportSuccess, setExportSuccess] = useState(false);
            const [activeSlot, setActiveSlot] = useState(null);
            
            // For simple click-to-swap fallback on mobile touch devices
            const [selectedSlotForSwap, setSelectedSlotForSwap] = useState(null);

            const canvasRef = useRef(null);
            const fileInputRef = useRef(null);

            useEffect(() => {
                const defaultLayout = LAYOUT_MATRIX[slotCount][0];
                setSelectedLayout(defaultLayout);
            }, [slotCount]);

            useEffect(() => {
                drawGridPreview();
            }, [selectedLayout, images, gapSize, borderRadius, bgColor, borderColor, borderWidth, outerPadding, titleText, subtitleText, showText, fontFamily, textPosition, textColor, textBgOpacity]);

            // === DRAG & DROP LOGIC (SWAP IMAGES) ===
            const handleDragStart = (e, index) => {
                e.dataTransfer.setData('text/plain', index);
            };

            const handleDrop = (e, targetIndex) => {
                e.preventDefault();
                const sourceIndex = e.dataTransfer.getData('text/plain');
                if (sourceIndex && sourceIndex !== targetIndex) {
                    swapSlots(sourceIndex, targetIndex);
                }
            };

            const handleDragOver = (e) => {
                e.preventDefault();
            };

            // Touch alternative: Click-to-Swap for mobile devices
            const handleSlotTouchClick = (id) => {
                if (selectedSlotForSwap === null) {
                    setSelectedSlotForSwap(id);
                } else {
                    if (selectedSlotForSwap !== id) {
                        swapSlots(selectedSlotForSwap, id);
                    }
                    setSelectedSlotForSwap(null);
                }
            };

            const swapSlots = (idx1, idx2) => {
                const updatedImages = { ...images };
                const temp = updatedImages[idx1];
                updatedImages[idx1] = updatedImages[idx2];
                updatedImages[idx2] = temp;
                setImages(updatedImages);
            };

            // === IMAGE UPLOADING ===
            const triggerImageUpload = (slotId) => {
                setActiveSlot(slotId);
                fileInputRef.current.click();
            };

            const handleImageFileChange = (e) => {
                const file = e.target.files[0];
                if (file && activeSlot) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        setImages({
                            ...images,
                            [activeSlot]: event.target.result
                        });
                    };
                    reader.readAsDataURL(file);
                }
            };

            const resetToDefaultImages = () => {
                setImages({
                    1: MOCK_IMAGES[1],
                    2: MOCK_IMAGES[2],
                    3: MOCK_IMAGES[3],
                    4: MOCK_IMAGES[4],
                    5: MOCK_IMAGES[5],
                    6: MOCK_IMAGES[6]
                });
            };

            const drawGridPreview = () => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                
                canvas.width = 1080;
                canvas.height = 1920;
                
                ctx.fillStyle = bgColor;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                const pad = outerPadding * 2;
                const workingW = canvas.width - (pad * 2);
                const workingH = canvas.height - (pad * 2);
                const startX = pad;
                const startY = pad;

                const colWidth = workingW / 12;
                const rowHeight = workingH / 12;
                const actualGap = gapSize * 2;
                const actualRadius = borderRadius * 2;

                const drawPromises = selectedLayout.slots.map((slot) => {
                    return new Promise((resolve) => {
                        const imgUrl = images[slot.id] || 'https://via.placeholder.com/600x600/27272a/8e8e93?text=MAKNA';
                        const img = new Image();
                        img.crossOrigin = "anonymous";
                        
                        img.onload = () => {
                            const slotX = startX + (slot.x * colWidth) + (actualGap / 2);
                            const slotY = startY + (slot.y * rowHeight) + (actualGap / 2);
                            const slotW = (slot.w * colWidth) - actualGap;
                            const slotH = (slot.h * rowHeight) - actualGap;

                            ctx.save();
                            
                            if (actualRadius > 0) {
                                ctx.beginPath();
                                ctx.moveTo(slotX + actualRadius, slotY);
                                ctx.lineTo(slotX + slotW - actualRadius, slotY);
                                ctx.quadraticCurveTo(slotX + slotW, slotY, slotX + slotW, slotY + actualRadius);
                                ctx.lineTo(slotX + slotW, slotY + slotH - actualRadius);
                                ctx.quadraticCurveTo(slotX + slotW, slotY + slotH, slotX + slotW - actualRadius, slotY + slotH);
                                ctx.lineTo(slotX + actualRadius, slotY + slotH);
                                ctx.quadraticCurveTo(slotX, slotY + slotH, slotX, slotY + slotH - actualRadius);
                                ctx.lineTo(slotX, slotY + actualRadius);
                                ctx.quadraticCurveTo(slotX, slotY, slotX + actualRadius, slotY);
                                ctx.closePath();
                                ctx.clip();
                            }

                            const imgRatio = img.width / img.height;
                            const slotRatio = slotW / slotH;
                            let drawW, drawH, drawX, drawY;

                            if (imgRatio > slotRatio) {
                                drawH = slotH;
                                drawW = slotH * imgRatio;
                                drawX = slotX - (drawW - slotW) / 2;
                                drawY = slotY;
                            } else {
                                drawW = slotW;
                                drawH = slotW / imgRatio;
                                drawX = slotX;
                                drawY = slotY - (drawH - slotH) / 2;
                            }

                            ctx.drawImage(img, drawX, drawY, drawW, drawH);

                            if (borderWidth > 0) {
                                ctx.strokeStyle = borderColor;
                                ctx.lineWidth = borderWidth * 2;
                                ctx.strokeRect(slotX, slotY, slotW, slotH);
                            }

                            ctx.restore();
                            resolve();
                        };

                        img.onerror = () => {
                            const slotX = startX + (slot.x * colWidth) + (actualGap / 2);
                            const slotY = startY + (slot.y * rowHeight) + (actualGap / 2);
                            const slotW = (slot.w * colWidth) - actualGap;
                            const slotH = (slot.h * rowHeight) - actualGap;

                            ctx.fillStyle = '#1e1e24';
                            ctx.fillRect(slotX, slotY, slotW, slotH);
                            resolve();
                        };

                        img.src = imgUrl;
                    });
                });

                Promise.all(drawPromises).then(() => {
                    if (showText) {
                        drawTextOverlay(ctx, canvas.width, canvas.height);
                    }
                });
            };

            const drawTextOverlay = (ctx, canvasWidth, canvasHeight) => {
                ctx.save();
                
                const titleFont = fontFamily === 'serif' ? 'bold 64px Georgia, serif' : 'bold 54px system-ui, sans-serif';
                const subFont = fontFamily === 'serif' ? 'italic 36px Georgia, serif' : 'medium 32px system-ui, sans-serif';

                let boxY = 0;
                let boxH = 250;
                
                if (textPosition === 'top') {
                    boxY = outerPadding * 2 + 10;
                } else if (textPosition === 'center') {
                    boxY = (canvasHeight / 2) - (boxH / 2);
                } else {
                    boxY = canvasHeight - boxH - (outerPadding * 2) - 10;
                }

                ctx.fillStyle = `rgba(13, 13, 18, ${textBgOpacity / 100})`;
                ctx.fillRect(outerPadding * 2 + 10, boxY, canvasWidth - (outerPadding * 4) - 20, boxH);

                ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.lineWidth = 2;
                ctx.strokeRect(outerPadding * 2 + 10, boxY, canvasWidth - (outerPadding * 4) - 20, boxH);

                ctx.fillStyle = textColor;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = titleFont;
                ctx.fillText(titleText.toUpperCase(), canvasWidth / 2, boxY + 90);

                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.font = subFont;
                ctx.fillText(subtitleText, canvasWidth / 2, boxY + 165);

                ctx.strokeStyle = '#10b981';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo((canvasWidth / 2) - 100, boxY + 30);
                ctx.lineTo((canvasWidth / 2) + 100, boxY + 30);
                ctx.stroke();

                ctx.restore();
            };

            const exportAsImage = () => {
                setExporting(true);
                setTimeout(() => {
                    const canvas = canvasRef.current;
                    if (!canvas) return;

                    const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
                    
                    const link = document.createElement('a');
                    link.download = `MAKNA_Grid_Asymmetric_${slotCount}Slots_${Date.now()}.jpg`;
                    link.href = dataUrl;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    setExporting(false);
                    setExportSuccess(true);
                    setTimeout(() => setExportSuccess(false), 3000);
                }, 800);
            };

            return (
                <div className="flex flex-col min-h-screen bg-[#09090b] text-[#f4f4f5] font-sans antialiased">
                    {/* NAVBAR */}
                    <header className="border-b border-[#18181b] bg-[#09090b]/80 backdrop-blur-md px-6 py-4 flex flex-col md:flex-row items-start md:items-center justify-between gap-4 sticky top-0 z-50">
                        <div className="flex items-center gap-3">
                            <div className="p-2 bg-emerald-500/10 text-emerald-400 rounded-lg">
                                <Icons.Grid />
                            </div>
                            <div>
                                <h1 className="text-lg font-bold tracking-tight text-white flex items-center gap-2">
                                    MAKNA Dynamic Multi-Slot Canvas <span className="text-xs bg-emerald-500/15 text-emerald-400 px-2 py-0.5 rounded-full border border-emerald-500/20 font-mono">V6.0</span>
                                </h1>
                                <p className="text-xs text-zinc-400">Desainer Kolase Asimetris Fleksibel (Dukung 3 s/d 6 Langkah Resep)</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-2 w-full md:w-auto justify-end">
                            <button 
                                onClick={resetToDefaultImages}
                                className="flex items-center gap-1.5 px-3 py-1.5 bg-zinc-800/80 hover:bg-zinc-800 text-zinc-300 text-xs font-semibold rounded-lg transition-all border border-zinc-700/50"
                            >
                                <Icons.RotateCcw />
                                Reset Sampel
                            </button>
                            <button 
                                onClick={exportAsImage}
                                disabled={exporting}
                                className="flex items-center gap-1.5 px-4 py-1.5 bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-semibold rounded-lg transition-all shadow-md shadow-emerald-500/10 disabled:opacity-50"
                            >
                                {exporting ? <Icons.Loader2 /> : <Icons.Download />}
                                <span>Ekspor Hasil (1080p)</span>
                            </button>
                        </div>
                    </header>

                    {/* WORKSPACE AREA */}
                    <div className="flex flex-col lg:flex-row flex-1 p-6 gap-6 max-w-[1600px] mx-auto w-full">
                        
                        {/* PANEL KIRI: LIVE PREVIEW CANVAS */}
                        <div className="flex-1 flex flex-col items-center justify-center bg-[#121215] rounded-2xl border border-zinc-800/50 p-4 relative min-h-[550px] lg:min-h-[800px]">
                            
                            <div className="absolute top-4 left-4 z-10 flex items-center gap-2 bg-zinc-950/80 backdrop-blur-md px-3 py-1.5 rounded-full border border-zinc-800 text-[11px] text-zinc-400">
                                <span className="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-ping"></span>
                                Klik/sentuh satu slot lalu sentuh slot lain untuk menukar gambar (Touch Safe)
                            </div>

                            {/* DYNAMIC CANVAS WRAPPER (9:16 VERTICAL ASPECT) */}
                            <div className="relative w-full max-w-[420px] aspect-[9/16] shadow-2xl rounded-2xl overflow-hidden border border-zinc-800/80 bg-zinc-950">
                                {/* Real Canvas Rendering */}
                                <canvas ref={canvasRef} className="hidden" />

                                {/* DOM Preview Grid layer */}
                                <div 
                                    className="absolute inset-0 p-4 grid grid-cols-12 grid-rows-12"
                                    style={{ 
                                        backgroundColor: bgColor,
                                        padding: `${outerPadding / 2}px`,
                                        gap: `${gapSize / 2}px`
                                    }}
                                >
                                    {selectedLayout.slots.map((slot) => {
                                        const imgUrl = images[slot.id];
                                        const isSelectedForSwap = selectedSlotForSwap === slot.id;
                                        
                                        return (
                                            <div
                                                key={slot.id}
                                                draggable
                                                onDragStart={(e) => handleDragStart(e, slot.id)}
                                                onDrop={(e) => handleDrop(e, slot.id)}
                                                onDragOver={handleDragOver}
                                                onClick={() => handleSlotTouchClick(slot.id)}
                                                style={{
                                                    gridColumnStart: slot.x + 1,
                                                    gridColumnEnd: slot.x + slot.w + 1,
                                                    gridRowStart: slot.y + 1,
                                                    gridRowEnd: slot.y + slot.h + 1,
                                                    borderRadius: `${borderRadius / 2}px`,
                                                    borderColor: isSelectedForSwap ? '#10b981' : borderColor,
                                                    borderWidth: isSelectedForSwap ? '3px' : `${borderWidth / 2}px`
                                                }}
                                                className={`relative overflow-hidden group cursor-pointer border border-zinc-800/30 bg-zinc-900 flex items-center justify-center transition-all duration-300 hover:shadow-lg hover:shadow-emerald-500/5 ${isSelectedForSwap ? 'ring-4 ring-emerald-500/20 scale-[0.98]' : ''}`}
                                            >
                                                {/* Cover image display */}
                                                {imgUrl ? (
                                                    <img 
                                                        src={imgUrl} 
                                                        alt={slot.label} 
                                                        className="w-full h-full object-cover pointer-events-none"
                                                    />
                                                ) : (
                                                    <div className="flex flex-col items-center justify-center p-4 text-center text-zinc-600">
                                                        <Icons.FileImage />
                                                        <span className="text-[10px] mt-1">{slot.label}</span>
                                                    </div>
                                                )}

                                                {/* Dark Overlay with edit buttons on hover */}
                                                <div className="absolute inset-0 bg-black/70 opacity-0 group-hover:opacity-100 flex flex-col items-center justify-center gap-2 transition-opacity duration-200">
                                                    <span className="text-[10px] font-bold text-emerald-400 tracking-wider uppercase px-2 py-0.5 bg-emerald-50/10 border border-emerald-500/20 rounded">
                                                        {slot.label}
                                                    </span>
                                                    <div className="flex items-center gap-1.5 mt-1">
                                                        <button 
                                                            onClick={(e) => { e.stopPropagation(); triggerImageUpload(slot.id); }}
                                                            className="p-1.5 bg-zinc-800 hover:bg-zinc-700 text-white rounded-lg transition-colors border border-zinc-700/50"
                                                            title="Ganti Foto"
                                                        >
                                                            <Icons.Upload />
                                                        </button>
                                                        <button 
                                                            onClick={(e) => { e.stopPropagation(); setImages({ ...images, [slot.id]: '' }); }}
                                                            className="p-1.5 bg-zinc-800 hover:bg-rose-500 text-white rounded-lg transition-colors border border-zinc-700/50"
                                                            title="Hapus"
                                                        >
                                                            <Icons.Trash2 />
                                                        </button>
                                                    </div>
                                                </div>

                                                {/* Slot badge indicator */}
                                                <div className="absolute top-2 left-2 w-5 h-5 bg-black/60 backdrop-blur-sm rounded-full flex items-center justify-center text-[10px] font-bold text-zinc-300 border border-white/10">
                                                    {slot.id}
                                                </div>
                                            </div>
                                        );
                                    })}

                                    {/* Text overlay simulation */}
                                    {showText && (
                                        <div 
                                            className="absolute left-4 right-4 pointer-events-none text-center p-3 rounded-lg border border-white/5 bg-zinc-950/90 backdrop-blur-sm flex flex-col justify-center items-center shadow-xl"
                                            style={{
                                                bottom: textPosition === 'bottom' ? '20px' : 'auto',
                                                top: textPosition === 'top' ? '20px' : textPosition === 'center' ? 'calc(50% - 60px)' : 'auto',
                                                opacity: textBgOpacity / 100,
                                                fontFamily: fontFamily === 'serif' ? 'Georgia, serif' : 'system-ui, sans-serif'
                                            }}
                                        >
                                            <div className="w-12 h-[2px] bg-emerald-400 mb-1.5"></div>
                                            <h3 className="text-xs font-black text-white tracking-widest uppercase">{titleText || 'JUDUL RESEP'}</h3>
                                            <p className="text-[9px] text-zinc-400 mt-0.5">{subtitleText || 'Sub-deskripsi resep'}</p>
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* Toast Notification */}
                            {exportSuccess && (
                                <div className="absolute bottom-6 bg-emerald-500/90 text-white font-bold text-xs px-6 py-3 rounded-xl border border-emerald-400 flex items-center gap-2 shadow-lg shadow-emerald-500/20 backdrop-blur-md animate-bounce">
                                    <Icons.Check />
                                    Kolase asimetris {slotCount} gambar berhasil diekspor!
                                </div>
                            )}
                        </div>

                        {/* PANEL KANAN: DYNAMIC SLOT ENGINE CONTROLLERS */}
                        <div className="w-full lg:w-[420px] flex flex-col gap-6">
                            
                            {/* 1. SELEKTOR JUMLAH SLOT (3 - 6 GAMBAR) */}
                            <div className="bg-[#121215] border border-zinc-800/50 rounded-2xl p-5 flex flex-col gap-4">
                                <h3 className="text-xs font-bold uppercase text-emerald-400 tracking-wider flex items-center gap-2">
                                    <Icons.ImageIcon /> 
                                    <span>1. Pilih Jumlah Langkah / Gambar</span>
                                </h3>
                                
                                <div className="grid grid-cols-4 gap-2">
                                    {[3, 4, 5, 6].map((num) => (
                                        <button
                                            key={num}
                                            onClick={() => setSlotCount(num)}
                                            className={`py-2 px-3.5 rounded-xl border font-bold text-xs transition-all flex flex-col items-center justify-center gap-1 ${
                                                slotCount === num
                                                    ? 'bg-emerald-500/10 border-emerald-500 text-emerald-400 shadow-md shadow-emerald-500/5'
                                                    : 'bg-zinc-900/60 border-zinc-800 text-zinc-400 hover:bg-zinc-900'
                                            }`}
                                        >
                                            <span className="text-base">{num}</span>
                                            <span className="text-[9px] uppercase font-normal opacity-75">Slot</span>
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* 2. SELEKTOR LAYOUT PRESET YANG DINORMALISASI */}
                            <div className="bg-[#121215] border border-zinc-800/50 rounded-2xl p-5 flex flex-col gap-4">
                                <h3 className="text-xs font-bold uppercase text-emerald-400 tracking-wider flex items-center gap-2">
                                    <Icons.Layers /> 
                                    <span>2. Pilih Tata Letak Asimetris ({slotCount} Gambar)</span>
                                </h3>
                                
                                <div className="grid grid-cols-1 gap-2.5">
                                    {(LAYOUT_MATRIX[slotCount] || []).map((layout) => (
                                        <button
                                            key={layout.id}
                                            onClick={() => setSelectedLayout(layout)}
                                            className={`flex flex-col text-left p-3.5 rounded-xl border transition-all ${
                                                selectedLayout.id === layout.id
                                                    ? 'bg-emerald-500/5 border-emerald-500 text-white shadow-md shadow-emerald-500/5'
                                                    : 'bg-zinc-900/60 border-zinc-800 text-zinc-400 hover:bg-zinc-900 hover:border-zinc-700'
                                            }`}
                                        >
                                            <div className="flex items-center justify-between w-full">
                                                <span className="text-xs font-bold text-white">{layout.name}</span>
                                                {selectedLayout.id === layout.id && (
                                                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                                                )}
                                            </div>
                                            <p className="text-[10px] text-zinc-400 mt-1 leading-relaxed">{layout.desc}</p>
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* 3. PENGATURAN ESTETIKA CANVAS */}
                            <div className="bg-[#121215] border border-zinc-800/50 rounded-2xl p-5 flex flex-col gap-5">
                                <h3 className="text-xs font-bold uppercase text-emerald-400 tracking-wider flex items-center gap-2">
                                    <Icons.Sliders /> 
                                    <span>3. Dimensi & Jarak Spasi</span>
                                </h3>

                                <div className="flex flex-col gap-4">
                                    {/* Slider Jarak / Gap */}
                                    <div className="flex flex-col gap-1.5">
                                        <div className="flex justify-between items-center text-[11px] font-bold text-zinc-400">
                                            <span>Jarak Jeda Antar Foto (Gap):</span>
                                            <span className="font-mono text-white bg-zinc-800 px-1.5 py-0.5 rounded">{gapSize}px</span>
                                        </div>
                                        <input 
                                            type="range" 
                                            min="0" 
                                            max="32" 
                                            value={gapSize} 
                                            onChange={(e) => setGapSize(parseInt(e.target.value))}
                                            className="w-full accent-emerald-400 h-1 bg-zinc-800 rounded-lg appearance-none cursor-pointer"
                                        />
                                    </div>

                                    {/* Slider Kelengkungan Sudut */}
                                    <div className="flex flex-col gap-1.5">
                                        <div className="flex justify-between items-center text-[11px] font-bold text-zinc-400">
                                            <span>Kelengkungan Sudut (Border Radius):</span>
                                            <span className="font-mono text-white bg-zinc-800 px-1.5 py-0.5 rounded">{borderRadius}px</span>
                                        </div>
                                        <input 
                                            type="range" 
                                            min="0" 
                                            max="48" 
                                            value={borderRadius} 
                                            onChange={(e) => setBorderRadius(parseInt(e.target.value))}
                                            className="w-full accent-emerald-400 h-1 bg-zinc-800 rounded-lg appearance-none cursor-pointer"
                                        />
                                    </div>

                                    {/* Slider Margin Tepi Luar */}
                                    <div className="flex flex-col gap-1.5">
                                        <div className="flex justify-between items-center text-[11px] font-bold text-zinc-400">
                                            <span>Padding Frame Luar:</span>
                                            <span className="font-mono text-white bg-zinc-800 px-1.5 py-0.5 rounded">{outerPadding}px</span>
                                        </div>
                                        <input 
                                            type="range" 
                                            min="4" 
                                            max="40" 
                                            value={outerPadding} 
                                            onChange={(e) => setOuterPadding(parseInt(e.target.value))}
                                            className="w-full accent-emerald-400 h-1 bg-zinc-800 rounded-lg appearance-none cursor-pointer"
                                        />
                                    </div>

                                    <hr className="border-zinc-800/60 my-1" />

                                    {/* Warna Background */}
                                    <div className="grid grid-cols-2 gap-3.5">
                                        <div className="flex flex-col gap-1.5">
                                            <label className="text-[10px] font-bold text-zinc-400 uppercase">Warna Latar:</label>
                                            <div className="flex items-center gap-2">
                                                <input 
                                                    type="color" 
                                                    value={bgColor} 
                                                    onChange={(e) => setBgColor(e.target.value)}
                                                    className="w-8 h-8 rounded border border-zinc-700 bg-transparent cursor-pointer"
                                                />
                                                <span className="font-mono text-xs uppercase text-zinc-300">{bgColor}</span>
                                            </div>
                                        </div>

                                        <div className="flex flex-col gap-1.5">
                                            <label className="text-[10px] font-bold text-zinc-400 uppercase">Warna Garis Tepi:</label>
                                            <div className="flex items-center gap-2">
                                                <input 
                                                    type="color" 
                                                    value={borderColor} 
                                                    onChange={(e) => setBorderColor(e.target.value)}
                                                    className="w-8 h-8 rounded border border-zinc-700 bg-transparent cursor-pointer"
                                                />
                                                <span className="font-mono text-xs uppercase text-zinc-300">{borderColor}</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* 4. OVERLAY TEXT ENGINE */}
                            <div className="bg-[#121215] border border-zinc-800/50 rounded-2xl p-5 flex flex-col gap-4.5">
                                <div className="flex justify-between items-center">
                                    <h3 className="text-xs font-bold uppercase text-emerald-400 tracking-wider flex items-center gap-2">
                                        <Icons.Type /> 
                                        <span>4. Teks & Brand Overlay</span>
                                    </h3>
                                    <label className="relative inline-flex items-center cursor-pointer">
                                        <input 
                                            type="checkbox" 
                                            checked={showText} 
                                            onChange={(e) => setShowText(e.target.checked)}
                                            className="sr-only peer" 
                                        />
                                        <div className="w-9 h-5 bg-zinc-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-zinc-400 after:border-zinc-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-emerald-500 peer-checked:after:bg-white peer-checked:after:border-transparent"></div>
                                    </label>
                                </div>

                                {showText && (
                                    <div className="flex flex-col gap-3.5 mt-2 transition-all">
                                        <div className="flex flex-col gap-1.5">
                                            <label className="text-[10px] font-bold text-zinc-400 uppercase">Judul Resep / Produk:</label>
                                            <input 
                                                type="text" 
                                                value={titleText} 
                                                onChange={(e) => setTitleText(e.target.value)}
                                                className="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-emerald-500 text-white"
                                                placeholder="Masukkan judul..."
                                            />
                                        </div>

                                        <div className="flex flex-col gap-1.5">
                                            <label className="text-[10px] font-bold text-zinc-400 uppercase">Subtitle / Call-to-Action:</label>
                                            <input 
                                                type="text" 
                                                value={subtitleText} 
                                                onChange={(e) => setSubtitleText(e.target.value)}
                                                className="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-emerald-500 text-white"
                                                placeholder="Contoh: Menu Sehat Tanpa Ribet"
                                            />
                                        </div>

                                        <div className="grid grid-cols-2 gap-3.5">
                                            <div className="flex flex-col gap-1.5">
                                                <label className="text-[10px] font-bold text-zinc-400 uppercase">Keluarga Font:</label>
                                                <select 
                                                    value={fontFamily} 
                                                    onChange={(e) => setFontFamily(e.target.value)}
                                                    className="bg-zinc-900 border border-zinc-800 rounded-lg px-2.5 py-1.5 text-xs text-zinc-300 focus:outline-none focus:border-emerald-500"
                                                >
                                                    <option value="serif">Classic Serif (Georgia)</option>
                                                    <option value="sans">Modern Sans-Serif</option>
                                                </select>
                                            </div>

                                            <div className="flex flex-col gap-1.5">
                                                <label className="text-[10px] font-bold text-zinc-400 uppercase">Posisi Kotak Teks:</label>
                                                <select 
                                                    value={textPosition} 
                                                    onChange={(e) => setTextPosition(e.target.value)}
                                                    className="bg-zinc-900 border border-zinc-800 rounded-lg px-2.5 py-1.5 text-xs text-zinc-300 focus:outline-none focus:border-emerald-500"
                                                >
                                                    <option value="top">Di Bagian Atas</option>
                                                    <option value="center">Di Bagian Tengah</option>
                                                    <option value="bottom">Di Bagian Bawah</option>
                                                </select>
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-2 gap-3.5">
                                            <div className="flex flex-col gap-1.5">
                                                <label className="text-[10px] font-bold text-zinc-400 uppercase">Warna Teks Utama:</label>
                                                <div className="flex items-center gap-2">
                                                    <input 
                                                        type="color" 
                                                        value={textColor} 
                                                        onChange={(e) => setTextColor(e.target.value)}
                                                        className="w-7 h-7 rounded border border-zinc-800 bg-transparent cursor-pointer"
                                                    />
                                                    <span className="font-mono text-xs uppercase text-zinc-300">{textColor}</span>
                                                </div>
                                            </div>

                                            <div className="flex flex-col gap-1.5">
                                                <div className="flex justify-between items-center text-[10px] font-bold text-zinc-400 uppercase">
                                                    <span>Kepekatan Box Latar:</span>
                                                    <span>{textBgOpacity}%</span>
                                                </div>
                                                <input 
                                                    type="range" 
                                                    min="10" 
                                                    max="100" 
                                                    value={textBgOpacity} 
                                                    onChange={(e) => setTextBgOpacity(parseInt(e.target.value))}
                                                    className="w-full accent-emerald-400 h-1 bg-zinc-800 rounded-lg appearance-none cursor-pointer"
                                                />
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* HIDDEN FILE INPUT */}
                    <input 
                        type="file" 
                        ref={fileInputRef}
                        onChange={handleImageFileChange}
                        accept="image/*"
                        className="hidden"
                    />
                </div>
            );
        }

        // Render React DOM to root
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
